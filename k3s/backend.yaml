# AlignFit API: FastAPI + MediaPipe + PyTorch CPU (image + video analysis).
# Stateless: pose model and recommendation SQLite DB are baked into the image.
# The trained MLP weights (mobi_mlp_*.pt) are NOT in the repo or the public
# image (licence), so /predict answers 503 until they are mounted into
# /app/models (verified against models/SHA256SUMS). Photo analysis is unaffected.
#
# The image tag is the full commit SHA, rewritten by
# .github/workflows/backend-image.yml after a tested image is published.
# The 40-zero tag is a placeholder: connect Argo CD only after the first CI
# run has replaced it (otherwise the pod stays in ImagePullBackOff).
#
# Names are deliberately new (`alignfit-api`): the hand-made legacy resources
# (Deployment `alignfit-backend` + NodePort 30081) were not touched and are kept
# for rollback; Caddy now sends traffic to 30080 (Traefik Gateway) -> this
# stack (2026-11-01). Labels use only app.kubernetes.io/* keys so no existing
# selector can match these pods.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alignfit-api
  namespace: alignfit
  labels:
    app.kubernetes.io/name: alignfit-api
    app.kubernetes.io/part-of: alignfit
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: alignfit-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alignfit-api
        app.kubernetes.io/part-of: alignfit
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: api
          image: ghcr.io/lkh599810/alignfit-backend:d94783560326a0b66dfbaa0ca117912c32dd8b01
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: ALIGNFIT_MAX_VIDEO_MB
              value: "100"
            - name: ALIGNFIT_MAX_VIDEO_SECONDS
              value: "60"
            - name: ALIGNFIT_MAX_IMAGE_MB
              value: "20"
          # Models load at startup (a few seconds); /health reports
          # video_model_loaded. The image endpoint works even if they fail.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            # Measured locally: ~300MB after model load, ~350MB after a video +
            # a 12MP photo request. Limit leaves room for long/high-res videos.
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 1536Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
---
# ClusterIP only: traffic arrives via HTTPRoute (k3s/httproute.yaml). NodePort
# 30081 stays on the legacy hand-made Service (rollback only) until it is retired.
apiVersion: v1
kind: Service
metadata:
  name: alignfit-api
  namespace: alignfit
  labels:
    app.kubernetes.io/name: alignfit-api
    app.kubernetes.io/part-of: alignfit
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: alignfit-api
  ports:
    - name: http
      port: 8000
      targetPort: http

# EMERGENCY ONLY -- not synced by Argo CD (outside k3s/).
# Recreates the pre-integration backend (photo analysis only) on NodePort 30081
# if the hand-made legacy resources were already deleted and the new stack must
# be bypassed. Image `:mobile-submission` is the one production ran before.
#   kubectl apply -f deploy/rollback/legacy-nodeport-30081.yaml
#   (then point Caddy back at 192.168.0.60:30081)
# Fails with "port already allocated" while the original 30081 Service still
# exists -- in that case nothing needs restoring.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alignfit-legacy
  namespace: alignfit
  labels:
    app.kubernetes.io/name: alignfit-legacy
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: alignfit-legacy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alignfit-legacy
    spec:
      containers:
        - name: api
          image: ghcr.io/lkh599810/alignfit-backend:mobile-submission
          ports:
            - name: http
              containerPort: 8000
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: alignfit-legacy
  namespace: alignfit
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: alignfit-legacy
  ports:
    - name: http
      port: 8000
      targetPort: http
      nodePort: 30081

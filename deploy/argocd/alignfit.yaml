# Argo CD Application for AlignFit. Apply once, by hand, after reviewing
# docs/deployment.md (kept outside k3s/ so the app does not manage itself):
#   kubectl apply -n argocd -f deploy/argocd/alignfit.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alignfit
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/lkh599810/AlignFit.git
    targetRevision: main
    path: k3s
  destination:
    server: https://kubernetes.default.svc
    namespace: alignfit
  syncPolicy:
    # Auto sync: a main push that updates k3s/ (CI image-tag commit) deploys
    # without a manual Sync. prune stays off: resources removed from Git are
    # left running until deleted by hand.
    automated:
      enabled: true
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=false

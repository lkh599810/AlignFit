<?xml version="1.0" encoding="UTF-8"?>
<!--
  AlignFit body map: front view.
  Mirror convention: screen-left = the user's own left side (like looking in a mirror).
  Each selectable region is a <polygon> with a unique id.
  Ellipses are decorative (head) and not selectable.
-->

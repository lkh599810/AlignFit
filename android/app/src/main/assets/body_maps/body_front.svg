<?xml version="1.0" encoding="UTF-8"?>
<!--
  AlignFit body map: front view.
  Mirror convention: screen-left = the user's own left side (like looking in a mirror).
  Each selectable region is a <polygon> with a unique id and its own fill attribute
  so regions can be recolored individually. Ellipses are decorative (head) and not
  selectable. Adjacent regions share edge coordinates so there are no tap gaps.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="200" height="440" viewBox="0 0 200 440">
  <title>AlignFit front body map</title>
  <g fill="#C9CED6" stroke="#8E97A3" stroke-width="1.5" stroke-linejoin="round">
    <ellipse cx="100" cy="30" rx="17" ry="22" fill="#C9CED6"/>
    <polygon id="front_neck" fill="#C9CED6" points="91,50 109,50 111,68 89,68"/>
    <polygon id="front_left_shoulder" fill="#C9CED6" points="89,68 89,96 66,98 52,94 54,84 72,72"/>
    <polygon id="front_right_shoulder" fill="#C9CED6" points="111,68 128,72 146,84 148,94 134,98 111,96"/>
    <polygon id="front_left_chest" fill="#C9CED6" points="66,98 89,96 89,68 100,68 100,148 70,148 68,124"/>
    <polygon id="front_right_chest" fill="#C9CED6" points="100,68 111,68 111,96 134,98 132,124 130,148 100,148"/>
    <polygon id="front_left_abdomen" fill="#C9CED6" points="70,148 100,148 100,192 74,192 72,170"/>
    <polygon id="front_right_abdomen" fill="#C9CED6" points="100,148 130,148 128,170 126,192 100,192"/>
    <polygon id="front_left_hip" fill="#C9CED6" points="74,192 100,192 100,250 72,250 67,220 70,200"/>
    <polygon id="front_right_hip" fill="#C9CED6" points="100,192 126,192 130,200 133,220 128,250 100,250"/>
    <polygon id="front_left_upper_arm" fill="#C9CED6" points="52,94 64,100 62,136 58,166 44,166 42,130 46,102"/>
    <polygon id="front_right_upper_arm" fill="#C9CED6" points="148,94 154,102 158,130 156,166 142,166 138,136 136,100"/>
    <polygon id="front_left_forearm" fill="#C9CED6" points="44,166 58,166 55,200 53,230 46,230 43,200"/>
    <polygon id="front_right_forearm" fill="#C9CED6" points="142,166 156,166 157,200 154,230 147,230 145,200"/>
    <polygon id="front_left_hand_wrist" fill="#C9CED6" points="46,230 53,230 56,242 55,262 49,270 43,262 42,242"/>
    <polygon id="front_right_hand_wrist" fill="#C9CED6" points="147,230 154,230 158,242 157,262 151,270 145,262 144,242"/>
    <polygon id="front_left_front_thigh" fill="#C9CED6" points="72,250 100,250 98,266 95,324 75,324 70,288"/>
    <polygon id="front_right_front_thigh" fill="#C9CED6" points="100,250 128,250 130,288 125,324 105,324 102,266"/>
    <polygon id="front_left_knee" fill="#C9CED6" points="75,324 95,324 93,354 77,354"/>
    <polygon id="front_right_knee" fill="#C9CED6" points="105,324 125,324 123,354 107,354"/>
    <polygon id="front_left_calf" fill="#C9CED6" points="77,354 93,354 94,372 89,406 79,406 74,372"/>
    <polygon id="front_right_calf" fill="#C9CED6" points="107,354 123,354 126,372 121,406 111,406 106,372"/>
    <polygon id="front_left_ankle_foot" fill="#C9CED6" points="79,406 89,406 90,418 92,430 62,430 62,422 78,416"/>
    <polygon id="front_right_ankle_foot" fill="#C9CED6" points="111,406 121,406 122,416 138,422 138,430 108,430 110,418"/>
  </g>

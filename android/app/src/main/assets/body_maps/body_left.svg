<?xml version="1.0" encoding="UTF-8"?>
<!--
  AlignFit body map: left side view (the person faces the left edge of the image).
  Front of the body = smaller x values, back of the body = larger x values.
  Each selectable region is a <polygon> with a unique id and its own fill attribute
  so regions can be recolored individually. Ellipses are decorative (head) and not
  selectable. The arm overlaps the torso and is listed after it, so taps on the
  arm area select the arm (hit testing picks the last matching region).
-->
<svg xmlns="http://www.w3.org/2000/svg" width="200" height="440" viewBox="0 0 200 440">
  <title>AlignFit left side body map</title>
  <g fill="#C9CED6" stroke="#8E97A3" stroke-width="1.5" stroke-linejoin="round">
    <ellipse cx="98" cy="30" rx="16" ry="21" fill="#C9CED6"/>
    <polygon id="left_side_neck" fill="#C9CED6" points="90,50 108,52 110,70 88,68"/>
    <polygon id="left_side_shoulder" fill="#C9CED6" points="88,68 110,70 126,76 128,100 78,100 80,76"/>
    <polygon id="left_side_chest" fill="#C9CED6" points="70,100 92,100 92,152 72,152 66,120"/>
    <polygon id="left_side_abdomen" fill="#C9CED6" points="72,152 92,152 92,206 74,206 70,178"/>
    <polygon id="left_side_upper_back" fill="#C9CED6" points="108,100 126,100 131,118 128,152 108,152"/>
    <polygon id="left_side_lower_back" fill="#C9CED6" points="105,152 128,152 122,170 124,186 105,186"/>
    <polygon id="left_side_waist" fill="#C9CED6" points="105,186 124,186 126,206 105,206"/>
    <polygon id="left_side_upper_arm" fill="#C9CED6" points="88,100 112,100 110,140 106,172 90,172 88,136"/>
    <polygon id="left_side_forearm" fill="#C9CED6" points="90,172 106,172 104,204 101,236 93,236 91,204"/>
    <polygon id="left_side_hand_wrist" fill="#C9CED6" points="93,236 101,236 104,248 102,268 96,274 91,266 91,248"/>
    <polygon id="left_side_hip" fill="#C9CED6" points="74,206 100,206 100,252 76,252 70,228"/>
    <polygon id="left_side_glute" fill="#C9CED6" points="100,206 126,206 133,226 128,250 100,252"/>
    <polygon id="left_side_thigh" fill="#C9CED6" points="76,252 128,250 124,290 118,326 82,326 76,290"/>
    <polygon id="left_side_knee" fill="#C9CED6" points="82,326 118,326 114,356 84,356"/>
    <polygon id="left_side_calf" fill="#C9CED6" points="84,356 114,356 118,374 110,408 88,408 84,374"/>
    <polygon id="left_side_ankle_foot" fill="#C9CED6" points="88,408 110,408 110,430 56,430 56,422 86,416"/>
  </g>
</svg>

    <polygon id="back_right_back_thigh" fill="#C9CED6" points="100,252 128,252 130,288 125,324 105,324 102,268"/>
    <polygon id="back_left_knee" fill="#C9CED6" points="75,324 95,324 93,354 77,354"/>
    <polygon id="back_right_knee" fill="#C9CED6" points="105,324 125,324 123,354 107,354"/>
    <polygon id="back_left_calf" fill="#C9CED6" points="77,354 93,354 94,372 89,406 79,406 74,372"/>

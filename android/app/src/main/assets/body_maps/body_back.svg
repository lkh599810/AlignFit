<?xml version="1.0" encoding="UTF-8"?>
<!--
  AlignFit body map: back view.
  Screen-left = the user's own left side (natural when viewed from behind).
  Each selectable region is a <polygon> with a unique id and its own fill attribute
  so regions can be recolored individually. Ellipses are decorative (head) and not
  selectable. Adjacent regions share edge coordinates so there are no tap gaps.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="200" height="440" viewBox="0 0 200 440">
  <title>AlignFit back body map</title>
  <g fill="#C9CED6" stroke="#8E97A3" stroke-width="1.5" stroke-linejoin="round">
    <ellipse cx="100" cy="30" rx="17" ry="22" fill="#C9CED6"/>
    <polygon id="back_neck" fill="#C9CED6" points="91,50 109,50 111,68 89,68"/>
    <polygon id="back_left_shoulder" fill="#C9CED6" points="89,68 89,96 66,98 52,94 54,84 72,72"/>
    <polygon id="back_right_shoulder" fill="#C9CED6" points="111,68 128,72 146,84 148,94 134,98 111,96"/>
    <polygon id="back_left_upper_back" fill="#C9CED6" points="66,98 89,96 89,68 100,68 100,148 70,148 68,124"/>
    <polygon id="back_right_upper_back" fill="#C9CED6" points="100,68 111,68 111,96 134,98 132,124 130,148 100,148"/>
    <polygon id="back_left_lower_back" fill="#C9CED6" points="70,148 100,148 100,180 73,180 72,166"/>
    <polygon id="back_right_lower_back" fill="#C9CED6" points="100,148 130,148 128,166 127,180 100,180"/>
    <polygon id="back_left_waist" fill="#C9CED6" points="73,180 100,180 100,202 71,202 72,190"/>
    <polygon id="back_right_waist" fill="#C9CED6" points="100,180 127,180 128,190 129,202 100,202"/>
    <polygon id="back_left_glute" fill="#C9CED6" points="71,202 100,202 100,252 72,252 66,226"/>
    <polygon id="back_right_glute" fill="#C9CED6" points="100,202 129,202 134,226 128,252 100,252"/>
    <polygon id="back_left_upper_arm" fill="#C9CED6" points="52,94 64,100 62,136 58,166 44,166 42,130 46,102"/>
    <polygon id="back_right_upper_arm" fill="#C9CED6" points="148,94 154,102 158,130 156,166 142,166 138,136 136,100"/>
    <polygon id="back_left_forearm" fill="#C9CED6" points="44,166 58,166 55,200 53,230 46,230 43,200"/>
    <polygon id="back_right_forearm" fill="#C9CED6" points="142,166 156,166 157,200 154,230 147,230 145,200"/>
    <polygon id="back_left_hand_wrist" fill="#C9CED6" points="46,230 53,230 56,242 55,262 49,270 43,262 42,242"/>
